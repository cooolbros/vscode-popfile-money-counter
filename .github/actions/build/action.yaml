# https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action
name: build
description: Build

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: latest
    - uses: pnpm/action-setup@v6

    - name: Install Dependencies
      run: pnpm install
      shell: bash

    - name: Build
      run: pnpm build
      shell: bash
