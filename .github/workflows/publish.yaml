name: publish

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm build
      - run: pnpm vsce publish --oidc
      - run: pnpm ovsx publish --trusted-publishing
